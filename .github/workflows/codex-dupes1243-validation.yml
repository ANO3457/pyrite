name: Validate duplicate finder on current dev
on:
  push:
    branches: ['validation/codex24-dupes1243']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete test environment
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all]' setuptools wheel uv
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then pip install -e "$ext"; fi
          done
      - name: Cache the local embedding model
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"
      - name: Exact merged product and source gates
        run: |
          git checkout 00ddf36581b445703641aafae1b0a79910bc4f7b
          python scripts/check_checkout_imports.py
          ruff check pyrite/ tests/ extensions/
          ruff format --check pyrite/ tests/ extensions/
          python scripts/check_import_cycles.py
          python scripts/check_fix_commit_has_tests.py --range HEAD^1 HEAD
      - name: Duplicate clusters, effective status and root declaration
        run: pytest tests/test_qa_duplicates.py tests/test_effective_status_everywhere.py tests/test_changelog_fragments.py tests/test_requested_effect_exit_code.py::test_a_command_on_the_contract_is_declared_the_way_the_root_expects -q -n 4 --durations=10 --junitxml=focused.xml
      - name: Required affected selection against current dev
        run: python scripts/test-affected --run --base c30b1c120fb8db798f2331472ff79bb28af44684 -n 4 -- --junitxml=affected.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dupes1243-current-dev
          path: |
            focused.xml
            affected.xml
