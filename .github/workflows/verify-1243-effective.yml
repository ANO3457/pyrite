name: Verify duplicate effective status
on:
  push:
    branches: ['validation/codex23-1243-effective']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -e '.[cli,server,dev]' sqlite-vec
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then pip install -e "$ext"; fi
          done
      - run: |
          ruff check pyrite/services/qa_service.py tests/test_effective_status_everywhere.py
          ruff format --check pyrite/services/qa_service.py tests/test_effective_status_everywhere.py
          pytest tests/test_qa_duplicates.py tests/test_effective_status_everywhere.py tests/test_requested_effect_exit_code.py tests/test_production_wiring_guard.py tests/test_default_output_is_the_result.py -q --no-cov
        env:
          HF_HUB_OFFLINE: '1'
          GITHUB_BASE_REF: dev
