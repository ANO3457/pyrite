name: Update roadmap through the project CLI
on:
  push:
    branches: ['validation/codex24-roadmap1190']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install KB CLI
        run: |
          pip install -e '.[cli,server,dev]' sqlite-vec setuptools wheel uv
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then pip install -e "$ext"; fi
          done
      - name: Read baseline KB health without changing any entry
        run: |
          git checkout df1752e4b23af5938463fe91525ccc449bd2a19e
          export PYRITE_CONFIG_DIR="$RUNNER_TEMP/roadmap-config"
          export PYRITE_DATA_DIR="$RUNNER_TEMP/roadmap-config"
          export PYRITE_AUTO_EMBED=0
          pyrite kb add "$PWD/kb" --name pyrite --type software
          pyrite index sync -k pyrite --no-embed
          pyrite index health > health-before.log
          pyrite schema validate kb/ > schema-before.log
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap1190-baseline
          path: |
            health-before.log
            schema-before.log
