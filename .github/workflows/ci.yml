name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.13 .venv
      - run: |
          uv pip install --python .venv/bin/python -e '.[cli,server,dev]'
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then
              uv pip install --python .venv/bin/python -e "$ext"
            fi
          done
      - name: Run focused real workflows
        run: .venv/bin/pytest tests/test_sw_adr_blank_scope.py extensions/software-kb/tests/test_software_kb.py::TestSwCreateAdrNumbersFromFiles extensions/software-kb/tests/test_software_kb.py::TestNewAdrGoesThroughPipeline tests/test_kb_walk.py::TestMcp::test_a_blank_name_is_never_kb_not_found -q --durations=25 --durations-min=1.0 -o junit_family=xunit1 --junitxml=evidence.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-evidence
          path: evidence.xml
