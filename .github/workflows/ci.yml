name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.13 .venv
      - run: |
          uv pip install --python .venv/bin/python -e '.[cli,server,dev]'
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then
              uv pip install --python .venv/bin/python -e "$ext"
            fi
          done
      - name: Run focused real workflows
        run: .venv/bin/pytest tests/test_corrupt_index_refusal.py tests/test_layer_boundaries.py tests/test_search_contract.py::TestClassification::test_a_quoted_dotted_column_filter_is_the_callers_fault tests/test_search_contract.py::TestClassification::test_rest_answers_it_400 tests/test_search_contract.py::TestMcpContract::test_a_refusal_that_is_not_a_storage_fault_is_not_logged[syntax] tests/test_services.py::TestSearchService::test_search_raises_query_syntax_error_not_raw_db_error tests/test_auth_bootstrap.py::TestInviteRedemption::test_a_taken_username_does_not_burn_the_code tests/test_auth_service.py::TestRegister::test_duplicate_username_raises tests/test_ephemeral_kb_privacy_persists.py::TestRepairOfEphemeralRegistryRowsWithoutConfig tests/test_doc_agent_contracts.py tests/test_test_process_memory_is_bounded.py::test_apps_a_test_builds_are_freed_after_its_teardown -q --durations=25 --durations-min=1.0 -o junit_family=xunit1 --junitxml=evidence.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-evidence
          path: evidence.xml
