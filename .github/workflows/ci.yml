name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.13 .venv
      - run: |
          uv pip install --python .venv/bin/python -e '.[cli,server,dev]'
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then
              uv pip install --python .venv/bin/python -e "$ext"
            fi
          done
      - name: Run focused real workflows
        run: .venv/bin/pytest tests/test_corrupt_index_refusal.py tests/test_mcp_server.py::TestPyriteMCPServer::test_kb_search_query_syntax_error_is_not_internal tests/test_fields_acceptors.py::test_the_rich_fallback_to_file_search_says_so_without_naming_files tests/test_ephemeral_kb_privacy_persists.py::TestRepairOfEphemeralRegistryRowsWithoutConfig::test_a_repair_that_cannot_write_still_loads_the_kb_private tests/test_test_process_memory_is_bounded.py::test_apps_a_test_builds_are_freed_after_its_teardown -q --durations=25 --durations-min=1.0 -o junit_family=xunit1 --junitxml=evidence.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-evidence
          path: evidence.xml
