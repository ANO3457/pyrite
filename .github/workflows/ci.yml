name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.13 .venv
      - run: |
          uv pip install --python .venv/bin/python -e '.[cli,server,dev]'
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then
              uv pip install --python .venv/bin/python -e "$ext"
            fi
          done
      - name: Restore tested feature workflow for source-contract tests
        run: git show HEAD^1:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Run focused real workflows
        run: .venv/bin/pytest tests/test_complete_parent_claim_routes.py -q --durations=25 --durations-min=1.0 -o junit_family=xunit1 --junitxml=evidence.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-evidence
          path: evidence.xml
