name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.13 .venv
      - run: |
          uv pip install --python .venv/bin/python -e '.[cli,server,dev]'
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then
              uv pip install --python .venv/bin/python -e "$ext"
            fi
          done
      - name: Verify the three refusals fail before the fix
        run: |
          git show cea3801253f59b759e6ff739d65b2b521f2c6977:pyrite/server/endpoints/entries.py > pyrite/server/endpoints/entries.py
          git show cea3801253f59b759e6ff739d65b2b521f2c6977:pyrite/server/schemas.py > pyrite/server/schemas.py
          set +e
          .venv/bin/pytest tests/test_rest_update_unknown_fields.py -k put_refuses -q --junitxml=red.xml
          result=$?
          set -e
          test "$result" = 1
          .venv/bin/python -c "import xml.etree.ElementTree as E;s=list(E.parse('red.xml').getroot().iter('testsuite'));assert sum(int(x.get('failures',0))for x in s)==3;assert sum(int(x.get('errors',0))for x in s)==0"
          git show a73689b4120dcd12df84968bf943bf410ac5e80f:pyrite/server/endpoints/entries.py > pyrite/server/endpoints/entries.py
          git show a73689b4120dcd12df84968bf943bf410ac5e80f:pyrite/server/schemas.py > pyrite/server/schemas.py
      - name: Run focused real workflows
        run: .venv/bin/pytest tests/test_rest_update_unknown_fields.py tests/test_production_wiring_guard.py tests/test_tests_drive_the_surface_not_the_mock.py -q --durations=25 --durations-min=1.0 -o junit_family=xunit1 --junitxml=evidence.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-evidence
          path: |
            evidence.xml
            red.xml