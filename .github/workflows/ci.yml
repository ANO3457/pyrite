name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.13 .venv
      - run: |
          uv pip install --python .venv/bin/python -e '.[cli,server,dev]'
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then
              uv pip install --python .venv/bin/python -e "$ext"
            fi
          done
      - name: Run focused real workflows
        run: .venv/bin/pytest tests/test_mcp_report_encoding.py tests/test_mcp_setup_reads_back.py::test_text_report_reads_well_with_one_client_changed_and_one_stopped tests/test_mcp_setup_reads_back.py::test_text_report_gives_old_and_new_as_a_person_would_type_them -q --durations=25 --durations-min=1.0 -o junit_family=xunit1 --junitxml=evidence.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-evidence
          path: evidence.xml
