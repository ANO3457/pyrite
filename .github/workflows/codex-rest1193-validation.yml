name: Validate PUT refusal branch maintenance
on:
  push:
    branches: ['validation/codex23-rest1193']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all,postgres]'
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then pip install -e "$ext"; fi
          done
      - name: Cache the real local embedding model needed by existing tests
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2', trust_remote_code=False)"
      - name: Recheck the previously missing model test
        run: pytest tests/test_semantic_search_warns_when_nothing_is_embedded.py -q
        env:
          HF_HUB_OFFLINE: '1'
      - name: Prove mixed unknown and invalid values regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET
          paths = ['pyrite/server/endpoints/write_refusal.py', 'pyrite/server/endpoints/entries.py', 'pyrite/server/schemas.py']
          fixed = {path: Path(path).read_bytes() for path in paths}
          try:
              for path in paths:
                  Path(path).write_bytes(subprocess.check_output(['git', 'show', '2c6d4b9649c662062817756ee38e290136ef2b71:' + path]))
              result = subprocess.run(['pytest', 'tests/test_rest_update_unknown_fields.py', '-k', 'unknown_invalid', '-q', '--junitxml=red-shared.xml'])
              tree = ET.parse('red-shared.xml')
              assert result.returncode == 1
              assert len(tree.findall('.//testcase/failure')) == 1
              assert not tree.findall('.//testcase/error')
          finally:
              for path, source in fixed.items():
                  Path(path).write_bytes(source)
          PY
      - name: Focused real command regressions
        run: pytest tests/test_rest_update_unknown_fields.py tests/test_rest_patch_unknown_keys.py tests/test_websocket_delivery.py -q
      - name: Required affected tests
        run: python scripts/test-affected --run --files pyrite/server/endpoints/entries.py pyrite/server/schemas.py pyrite/server/endpoints/write_refusal.py tests/test_rest_update_unknown_fields.py tests/test_websocket_delivery.py docs/json-contracts.md
        env:
          HF_HUB_OFFLINE: '1'
      - name: Source checks
        if: always()
        run: |
          ruff check pyrite/ tests/ extensions/
          ruff format --check pyrite/ tests/ extensions/
