name: Validate lazy CLI branch maintenance
on:
  push:
    branches: ['validation/codex23-lazy1226']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI test environment and all five extensions
        run: |
          pip install -e '.[cli,server,dev]' sqlite-vec setuptools wheel
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then pip install -e "$ext"; fi
          done
      - name: Prove production code matches the previous broad Linux run
        run: git diff --exit-code 123b1eb073cf79d4e84d497527773241f861ae1d 225194f075c5847a87f2d217117448ae498600a4 -- pyrite/ ':(glob)extensions/*/src/**'
      - name: Recheck real ADR index reads and public entry points
        run: pytest extensions/software-kb/tests/test_adr_listing.py tests/test_cli_import_performance.py -q --junitxml=final-focused.xml
      - name: Source checks
        if: always()
        run: |
          ruff check pyrite/ tests/ extensions/
          ruff format --check pyrite/ tests/ extensions/
